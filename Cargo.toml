[package]
name = "tracegrep"
version = "0.1.0"
edition = "2021"
description = "Search code with ripgrep and Rust call graph context"

[dependencies]
anyhow = "1"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"

[dev-dependencies]
tempfile = "3"
